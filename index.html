<meta charset="utf-8">
<title>Portfolio-Blasen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Suchleiste oben, darunter Kreis-Voronoi links und Portfolio-Tabelle + BCG-Matrix rechts */
:root{
  --bg:#edf1f4; --surface:#ffffff; --surface-2:#f5f8fa; --ink:#132029; --muted:#5a6b78; --line:#d3dce3;
  --accent:#1d6f7d; --own:#e2a72c; --own-line:#9a6a07; --on-own:#1d1505;
  --g-neg:#c2573f; --g-flat:#8796a3; --g-mid:#4a9ea3; --g-high:#1e7a87; --g-hot:#0f5a68;
  --star:#2e9d58; --cow:#e0912a; --q:#3b78d8; --dog:#d2483b; --up:#2a8a5c;
  --comp:#7f8f9b; --comp-up:#6f9f82; --comp-down:#b5807a; --on-comp:#ffffff; --on-star:#ffffff; --on-cow:#1d1505; --on-q:#ffffff; --on-dog:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1620; --surface:#12212d; --surface-2:#172a38; --ink:#e4ecf2; --muted:#93a5b3; --line:#243a4b;
  --accent:#5cc0c9; --own:#f0b93e; --own-line:#ffd77a; --on-own:#1d1505;
  --g-neg:#d9735b; --g-flat:#6e8190; --g-mid:#3d8f97; --g-high:#2b7b88; --g-hot:#1b6372;
  --star:#4fca86; --cow:#f2a541; --q:#6aa2f5; --dog:#f0705f; --up:#5fcf96;
  --comp:#3f5566; --comp-up:#36594a; --comp-down:#5e3e3d; --on-comp:#e4ecf2; --on-star:#0c1620; --on-cow:#1d1505; --on-q:#0c1620; --on-dog:#0c1620; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1620; --surface:#12212d; --surface-2:#172a38; --ink:#e4ecf2; --muted:#93a5b3; --line:#243a4b;
  --accent:#5cc0c9; --own:#f0b93e; --own-line:#ffd77a; --on-own:#1d1505;
  --g-neg:#d9735b; --g-flat:#6e8190; --g-mid:#3d8f97; --g-high:#2b7b88; --g-hot:#1b6372;
  --star:#4fca86; --cow:#f2a541; --q:#6aa2f5; --dog:#f0705f; --up:#5fcf96;
  --comp:#3f5566; --comp-up:#36594a; --comp-down:#5e3e3d; --on-comp:#e4ecf2; --on-star:#0c1620; --on-cow:#1d1505; --on-q:#0c1620; --on-dog:#0c1620; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
.wrap{margin:0 auto;display:grid;gap:18px}
/* Querformat: Inhalt höchstens 4:3, mittig */
@media (orientation:landscape) and (min-width:1100px){.wrap{max-width:calc((100vh - 40px) * 4 / 3)}}
header{display:grid;gap:14px}
.eyebrow{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:68ch}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.search{position:relative;flex:1 1 320px;min-width:0}
label.l,.ctl>.l{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
#q{width:100%;font:inherit;font-size:18px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
#sugg{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:20;max-height:360px;overflow:auto;padding:4px}
.sg{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:7px;cursor:pointer;align-items:baseline}
.sg:hover,.sg.act{background:var(--surface-2)}
.sg b{font-weight:700}
.sg small{color:var(--muted);text-align:right}
.sg.claude{border-top:1px solid var(--line);margin-top:4px;color:var(--accent);font-weight:600}
.sg.hd{cursor:default;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 12px 2px}
.ctl{display:flex;flex-direction:column}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{white-space:nowrap;font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink);padding:10px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number]{font:inherit;width:74px;padding:9px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
/* Standard: Tabelle und Matrix links gestapelt, Diagramm rechts groß; schmaler wird gestapelt */
.main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"title title" "chart chart" "table bcg";gap:16px 18px;align-items:start;position:relative}
@media (min-width:1100px){
  /* Diagramm füllt die Höhe, seine Breite folgt daraus (--chartw per Skript); links nimmt den Rest */
  .main{grid-template-columns:minmax(370px,1fr) var(--chartw,minmax(0,2.4fr));grid-template-areas:"title title" "table chart" "bcg chart";
    grid-template-rows:auto minmax(0,1fr) auto;height:calc(100vh - 56px);min-height:660px;align-items:stretch}
  .main>[data-card=title]{align-self:end}
  .main .search{flex:1 1 320px;min-width:180px}
  .main #bcg{flex:none;height:auto}
  .main .toolbar{gap:10px}
}
@media (min-width:1100px) and (max-width:1599px){
  .main .seg button{padding:8px 9px;font-size:13px}
  .main #q{font-size:15px;padding:9px 12px}
  .main input[type=number]{width:58px;padding:7px 6px}
  .main label.l,.main .ctl>.l{font-size:11px;white-space:nowrap}
  .main .toolbar{justify-content:flex-start}
}
.main>[data-card=title]{grid-area:title}.main>[data-card=chart]{grid-area:chart}.main>[data-card=table]{grid-area:table}.main>[data-card=bcg]{grid-area:bcg}
@media (max-width:900px){.main{grid-template-columns:1fr;grid-template-areas:"title" "chart" "table" "bcg"}}
/* Zwischenbereich bis 1100 px: Kreis wächst mit der Breite, aber nie über die Fensterhöhe hinaus */
@media (max-width:1099px){#chart{max-height:calc(100vh - 210px);min-height:0}}
.card-x{position:relative;min-width:0;display:flex;flex-direction:column}
[data-card=table]{container-type:inline-size}
.sm-t{display:none}
.fold{all:unset;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:default}
.fold:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.zoomctl{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.zoomctl button{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:0;padding:4px 10px;cursor:pointer;min-width:32px}
.zoomctl button+button{border-left:1px solid var(--line)}
.zoomctl button:hover{background:var(--surface-2)}
.zoomctl button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#zoomReset{font-family:var(--mono);font-size:12px;min-width:58px}
#chart{cursor:grab}
.vol-inline,.rma-inline,.chip.bcg-inline{display:none;color:var(--muted)}
.chip.bcg-inline{margin-top:4px;width:max-content}
@container (max-width:330px){.tw .bcgc{display:none}.tw .chip.bcg-inline{display:block}}
tr.row.has-sub td{border-bottom:0}
tr.sub{cursor:pointer}
tr.sub td{border-bottom:0;padding-top:1px;padding-bottom:3px;font-size:12.5px}
tr.sub.last td{border-bottom:1px solid var(--line);padding-bottom:9px}
tr.sub:hover td,tr.sub.sel td{background:var(--surface-2)}
td.sub-name{padding-left:12px;color:var(--ink)}
td.sub-name i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
tr.sub td.sub-share{text-align:left;font-family:var(--mono);color:var(--ink)}
@container (max-width:400px){.tw .rma{display:none}.tw .rma-inline{display:block}}
@container (max-width:560px){.tw td.own small{display:none}.tw .vol{display:none}.tw .vol-inline{display:block}.tw .chip{font-size:10.5px;padding:1px 6px}.tw td,.tw th{padding-inline:4px}.tw th{white-space:normal;font-size:10px}.tw .gr{font-size:12px}}
.hd{padding:0;display:grid;gap:8px;min-width:0}
.hd[data-card=title]{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.ttl{display:grid;gap:8px}
@media (min-width:1100px) and (max-height:820px){.ttl .eyebrow{display:none}}
[data-card=title] .toolbar{flex:1 1 640px;min-width:0}
/* Passt die Kopfzeile nicht in eine Zeile: Suche allein in Zeile 1, alle Regler zusammen in Zeile 2 */
.toolbar.stack .search{flex:1 1 100%}
/* Zweizeilige Kopfzeile: Titel oben bündig statt unten */
.hd[data-card=title]:has(.toolbar.stack){align-items:flex-start}
.stage{position:relative;background:var(--surface);border-radius:16px;padding:18px;border:1px solid var(--line)}
.co{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.co h2{font-family:var(--display);font-size:32px;margin:0;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.co .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.ai{border-color:var(--q);color:var(--q)}
svg{display:block;width:100%;height:auto}
#chart{flex:1 1 auto;min-height:0;height:100%;margin-top:8px}
#bcg{flex:1 1 auto;min-height:0;height:100%}
.leaf{stroke:var(--surface);stroke-width:1.5;cursor:grab;touch-action:none}
.leaf:active{cursor:grabbing}
.mkt{fill:none;stroke:var(--surface);stroke-width:5;pointer-events:none}
.mkt.sel{stroke:var(--ink);stroke-width:3.5}
.ring{fill:none;stroke:var(--line);stroke-width:2}
.lbl{pointer-events:none;font-family:var(--body);font-weight:700}
.mlbl{cursor:grab;touch-action:none}
.mlbl text{pointer-events:auto}
.leader{fill:none;stroke:var(--ink);stroke-opacity:.6;stroke-width:1.3;pointer-events:none}
.leader-dot{fill:var(--ink);stroke:var(--surface);stroke-width:1.5;pointer-events:none}
.mlbl .mgr{font-family:var(--mono);font-weight:500;fill:var(--muted);letter-spacing:0}
.mlbl.sel .mname{text-decoration:underline;text-underline-offset:4px}
.mlbl rect{fill:transparent}
.mlbl text{font-family:var(--display);fill:var(--ink);font-weight:700;letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin-top:10px;justify-content:center}
.legend .lg{display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.legend .lg b{color:var(--ink)}
.legend .lg.off{opacity:.45}
.legend i{display:inline-block;width:13px;height:13px;border-radius:50%}
.hint{text-align:center;font-size:12.5px;color:var(--muted);margin:6px 0 0}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:7px 10px;border-radius:8px;max-width:240px;z-index:5;line-height:1.35}
#busy{position:absolute;inset:0;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:6}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:16px;margin:0 0 10px;color:var(--muted)}
.tw{overflow:auto;flex:1 1 auto;min-height:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 5px;border-bottom:1px solid var(--line);vertical-align:top}
td small{font-size:11.5px;line-height:1.3}
tr.row{cursor:pointer}
tr.row:hover td,tr.row.sel td{background:var(--surface-2)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.n{text-align:right}
.own{font-weight:700}
.own small{display:block;font-weight:400;color:var(--muted)}
.gr{font-family:var(--mono);font-weight:500}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1.5px solid currentColor}
.chip.Star{color:var(--star)}.chip.CashCow{color:var(--cow)}.chip.Fragezeichen{color:var(--q)}.chip.PoorDog{color:var(--dog)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.msg{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.msg[data-kind="err"]{border-color:var(--g-neg)}
.bcg text{font-size:11px;fill:var(--muted)}
.bcg .q{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.bcg .axis line,.bcg .axis path{stroke:var(--line)}
.bcg .axis text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.bcg .div{stroke:var(--muted);stroke-dasharray:4 4}
/* Handy: kompakte Kopfzeile, Suche über die volle Breite, Regler darunter; Wischen scrollt die Seite */
@media (max-width:600px){
  body{padding-block:10px 20px}
  .wrap,.main{gap:12px}
  .ttl{gap:4px}.ttl .eyebrow{font-size:11px}
  h1{font-size:28px}
  .hd[data-card=title]{flex-direction:column;align-items:stretch;gap:10px}
  .toolbar{gap:10px 12px}
  .search{flex:1 1 100%}
  #q{font-size:16px}
  .seg button{padding:8px 10px;font-size:13.5px}
  .stage,.card{padding:12px;border-radius:12px}
  .co h2{font-size:24px}
  .co .meta{font-size:11.5px}
  /* Legende: drei Zeilen (Star · Cash Cow / Fragezeichen · Poor Dog / grün · rot), gleiche Spaltenbreiten */
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;font-size:12px;justify-items:start}
  .legend .lg{display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:center;white-space:nowrap}
  .legend .lg .lv{grid-column:2;font-size:11.5px}
  .leaf,.mlbl{touch-action:auto!important;cursor:default}
  /* Suche als eigene Zeile, darunter alle drei Regler in einer Zeile */
  [data-card=title] .toolbar{flex:none;display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:end}
  .toolbar .search{grid-column:1/-1}
  .toolbar .ctl{min-width:0}
  .toolbar .seg button{padding:8px 7px;font-size:12.5px}
  .toolbar input[type=number]{width:46px;padding:7px 5px}
  .toolbar .ctl>span{white-space:nowrap}
  label.l,.ctl>.l{font-size:11px;white-space:nowrap}
  .lg-t{display:none}.sm-t{display:inline}
  /* Marktliste per Titel einklappbar */
  .fold{cursor:pointer}
  .fold::after{content:"▾";display:inline-block;margin-left:8px;transition:transform .15s}
  [data-card=table].collapsed .fold::after{transform:rotate(-90deg)}
  [data-card=table].collapsed .tw{display:none}
  [data-card=table].collapsed h3{margin-bottom:0}
}
</style>

<div class="wrap">
  <div id="msg" class="msg" hidden></div>
  <div class="main" id="board">
    <section class="card-x hd" data-card="title">
      <div class="ttl">
        <div class="eyebrow">Portfolioanalyse · Marktanteil × Marktwachstum</div>
        <h1>Portfolio-Blasen</h1>
      </div>
      <div class="toolbar">
      <div class="search">
        <label class="l" for="q">Unternehmen</label>
        <input id="q" type="text" autocomplete="off" placeholder="z. B. Google, Facebook, Porsche, Nespresso …" role="combobox" aria-expanded="false" aria-controls="sugg">
        <div id="sugg" role="listbox" hidden></div>
      </div>
      <div class="ctl"><span class="l">Größe nach</span>
        <div class="seg" id="sizeSeg"><button type="button" data-v="revenue" aria-pressed="true"><span class="lg-t">Konzernumsatz</span><span class="sm-t">Umsatz</span></button><button type="button" data-v="size" aria-pressed="false"><span class="lg-t">Marktvolumen</span><span class="sm-t">Volumen</span></button></div></div>
      <div class="ctl"><span class="l">Märkte</span>
        <div class="seg" id="topSeg"><button type="button" data-v="4" aria-pressed="true">Top 4</button><button type="button" data-v="6" aria-pressed="false">Top 6</button><button type="button" data-v="99" aria-pressed="false">Alle</button></div></div>
      <div class="ctl"><label class="l" for="thr"><span class="lg-t">Wachstum hoch ab</span><span class="sm-t">Wachstum ab</span></label>
        <span><input id="thr" type="number" min="0" max="50" step="1" value="10"> <span style="color:var(--muted)">%<span class="lg-t"> p.a.</span></span></span></div>
      </div>
    </section>
    <section class="stage card-x" data-card="chart" aria-label="Blasendiagramm">
      <div class="co">
        <h2 id="coName">–</h2>
        <span class="meta" id="coMeta"></span>
      </div>
      <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="badge" id="coBadge"></span>
        <div class="zoomctl" role="group" aria-label="Zoom">
          <button type="button" id="zoomOut" aria-label="Verkleinern">−</button>
          <button type="button" id="zoomReset" title="Zoom zurücksetzen">100 %</button>
          <button type="button" id="zoomIn" aria-label="Vergrößern">+</button>
        </div>
        <button class="btn" id="regen" type="button" hidden style="padding:4px 10px;font-size:12.5px">Mit Claude neu schätzen</button>
      </div>
      <svg id="chart" viewBox="-48 -48 696 696" role="img" aria-label="Blasendiagramm der Märkte"></svg>
      <div class="legend" id="legend"></div>
      <div id="tip" hidden></div>
      <div id="busy" hidden><div class="spin"></div><div id="busyText"></div><button class="btn" id="stop" type="button">Abbrechen</button></div>
    </section>

      <section class="card card-x" data-card="table">
        <h3><button class="fold" id="foldTable" type="button" aria-expanded="true" aria-controls="tableBody">Märkte im Portfolio</button></h3>
        <div class="tw" id="tableBody"><table>
          <thead><tr><th>Markt</th><th class="n vol">Volumen</th><th class="n">Wachstum</th><th>Eigene Produkte</th><th class="n rma">rel. MA</th><th class="bcgc">BCG</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
      </section>
      <section class="card card-x" data-card="bcg">
        <h3>BCG-Matrix</h3>
        <svg id="bcg" class="bcg" viewBox="0 0 420 250" role="img" aria-label="BCG-Matrix"></svg>
      </section>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-weighted-voronoi@1.1.3/build/d3-weighted-voronoi.js"></script>
<script>
// ---------- Eingebaute Beispieldaten (gerundete Schätzungen, Mrd. USD, Stand 2025) ----------
// players: [Name, Marktanteil %, 1 = eigenes Produkt]
const BUILTIN = [
 {id:"alphabet",name:"Alphabet",hq:"Mountain View, USA",revenue:400,year:2025,

// ---------- Analyse ----------
function analyse(m,thr){
  const own=m.players.filter(p=>p[2]), comp=m.players.filter(p=>!p[2]);
  const ownShare=own.reduce((a,p)=>a+p[1],0);
  const top=comp.reduce((a,p)=>Math.max(a,p[1]),0);
  const rel=top>0?ownShare/top:(ownShare>0?10:0);
  const hiG=m.growth>=thr, hiS=rel>=1;
  const bcg=hiG&&hiS?"Star":!hiG&&hiS?"Cash Cow":hiG?"Fragezeichen":"Poor Dog";
  return {own,comp,ownShare,rel,bcg};
}

const WV=d3.weightedVoronoi().x(d=>d.x).y(d=>d.y).weight(d=>d.w);
const pos=new Map();
let raf=0;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function marketsShown(){
  const ms=state.company.markets.slice().sort((a,b)=>(b[state.sizeBy]||0)-(a[state.sizeBy]||0));
  return ms.slice(0,state.top);
}

function renderLegend(sites){
  const el=$("#legend");el.innerHTML="";
  const total=d3.sum(sites,n=>n.v)||1;
  CATS.forEach(([c,v])=>{
    const sum=d3.sum(sites.filter(n=>n.a.bcg===c),n=>n.v);
    const s=document.createElement("span");s.className="lg"+(sum?"":" off");
    const i=document.createElement("i");i.style.background=`var(${v})`;
    const b=document.createElement("b");b.textContent=c;
    const t=document.createElement("span");t.className="lv";t.textContent=sum?`${fmt(sum/total*100)} % · ${fmt(sum,sum<10?1:0)} Mrd.`:"–";
    s.title=state.sizeBy==="revenue"?"Anteil am angezeigten Konzernumsatz":"Anteil am angezeigten Marktvolumen";
    s.append(i,b,t);el.append(s);
  });
  [["--comp-up",`Markt wächst ab ${fmt(state.thr)} % p.a.`,`Wachstum ≥ ${fmt(state.thr)} %`],["--comp-down",`Markt wächst unter ${fmt(state.thr)} % p.a.`,`Wachstum < ${fmt(state.thr)} %`]].forEach(([v,txt,short])=>{
    const s=document.createElement("span");s.className="lg";
    const i=document.createElement("i");i.style.cssText=`background:var(${v});border-radius:3px`;
    const t=document.createElement("span");t.className="lg-t";t.textContent=txt;
    const ts=document.createElement("span");ts.className="sm-t";ts.textContent=short;s.append(i,t,ts);el.append(s);
  });
}

// Eine Iteration: Zellen berechnen, Gewichte an Zielflächen anpassen, Punkte Richtung Zellmitte ziehen
function relax(sites,clip,fixed,pull){
  let cells=[];
  try{cells=WV.clip(clip)(sites)}catch(e){}
  const by=new Map();cells.forEach(c=>by.set(c.site.originalObject,c));
  let err=0,tot=0,move=0;
  for(const s of sites){
    const c=by.get(s)||null;s.poly=c;
    const area=c?Math.abs(d3.polygonArea(c)):0;
    err+=Math.abs(area-s.target);tot+=s.target;
    if(c&&s!==fixed){const [cx,cy]=d3.polygonCentroid(c);if(isFinite(cx)&&isFinite(cy)){const dx=(cx-s.x)*pull,dy=(cy-s.y)*pull;s.x+=dx;s.y+=dy;move+=Math.abs(dx)+Math.abs(dy)}}
    // Gewicht ~ Radius²: additiv Richtung Zielfläche
    s.w+=0.45*(s.target-area)/Math.PI;
  }
  const mn=d3.min(sites,s=>s.w);sites.forEach(s=>{s.w-=mn});
  for(let k=0;k<2;k++)for(const p of sites)for(const q of sites){
    if(p===q)continue;const o=p.w-q.w-((p.x-q.x)**2+(p.y-q.y)**2);if(o>0)q.w+=o+1e-6;
  }
  return {err:tot?err/tot:0,move};
}
// Polygon mit abgerundeten Ecken; die Ecken bleiben frei und zeigen den Hintergrund
function roundedPath(poly,r){
  const n=poly.length;if(n<3)return "";
  let d="";
  for(let i=0;i<n;i++){
    const p0=poly[(i-1+n)%n],p1=poly[i],p2=poly[(i+1)%n];
    const l1=Math.hypot(p1[0]-p0[0],p1[1]-p0[1])||1,l2=Math.hypot(p2[0]-p1[0],p2[1]-p1[1])||1;
    const t1=Math.min(r,l1/2)/l1,t2=Math.min(r,l2/2)/l2;
    const ax=p1[0]+(p0[0]-p1[0])*t1,ay=p1[1]+(p0[1]-p1[1])*t1,bx=p1[0]+(p2[0]-p1[0])*t2,by=p1[1]+(p2[1]-p1[1])*t2;
    d+=`${i?"L":"M"}${ax},${ay}Q${p1[0]},${p1[1]} ${bx},${by}`;
  }
  return d+"Z";
}
function keepInside(s,poly){
  const [cx,cy]=d3.polygonCentroid(poly);
  if(!isFinite(s.x)||!isFinite(s.y)){s.x=cx+Math.random()*4-2;s.y=cy+Math.random()*4-2;s.w=0}
  for(let k=0;k<12&&!d3.polygonContains(poly,[s.x,s.y]);k++){s.x=cx+(s.x-cx)*0.8;s.y=cy+(s.y-cy)*0.8}
}

const LBL={FS1:18,FS2:11.5,min:10};
// Mausrad zoomt im Breitbild direkt, sonst nur mit Strg/⌘ (damit die Seite scrollbar bleibt); auf Touch nur Knöpfe
const zoom=d3.zoom().scaleExtent([1,6]).filter(ev=>{
  if(ev.type==="wheel")return window.matchMedia("(min-width:1100px)").matches||ev.ctrlKey||ev.metaKey;
  if(ev.type.startsWith("touch"))return !window.matchMedia("(max-width:900px)").matches||ev.touches.length>1||zt.k>1;
  return (ev.button===0||ev.button===1)&&!ev.ctrlKey;
});
let zt=d3.zoomIdentity,tipT=0,relabel=null,relabelRaf=0;
// Ungezoomt darf der Browser mit einem Finger scrollen; gezoomt gehören alle Gesten dem Kreis
const setTouchAction=()=>{const el=$("#chart");if(el)el.style.touchAction=zt.k>1||!window.matchMedia("(max-width:900px)").matches?"none":"pan-x pan-y"};
const narrowScreen=()=>window.matchMedia("(max-width:900px)").matches;
function renderChart(){
  cancelAnimationFrame(raf);raf=0;
  const svg=d3.select("#chart");svg.selectAll("*").remove();
  // Kleine Bildschirme: Beschriftung in Bildschirm-Pixeln lesbar halten, Rand um den Kreis entsprechend weiten
  const sc=(svg.node().clientWidth||600)/696;
  LBL.FS1=Math.max(18,12/sc);LBL.FS2=Math.max(11.5,9.5/sc);LBL.min=Math.max(10,9/sc);
  const pad=Math.ceil(20+LBL.FS2*0.75+5+LBL.FS1*0.8);
  svg.attr("viewBox",`${CX-R-pad} ${CY-R-pad} ${2*(R+pad)} ${2*(R+pad)}`);
  const ms=marketsShown();
  const raw=ms.map(m=>Math.max(m[state.sizeBy]||0,0));
  const total=d3.sum(raw)||1, floor=total*0.035;
  const disp=raw.map(v=>Math.max(v,floor)), dsum=d3.sum(disp);
  const AREA=Math.abs(d3.polygonArea(CLIP));
  const rnd=mulberry(11);

  const sites=ms.map((m,i)=>{
    const prev=pos.get(state.company.name+"|"+m.name), a=analyse(m,state.thr);
    const ang=rnd()*2*Math.PI, rr=R*0.55*Math.sqrt(rnd());
    const s={m,a,v:raw[i],target:disp[i]/dsum*AREA,
      x:prev?prev.x:CX+rr*Math.cos(ang),y:prev?prev.y:CY+rr*Math.sin(ang),w:prev?prev.w:0};
    s.px=s.x;s.py=s.y;
    const used=m.players.reduce((t,p)=>t+p[1],0);
    const list=m.players.map((p,j)=>({name:p[0],share:p[1],own:!!p[2],rank:j}));
    if(used<99.5)list.push({name:"Sonstige",share:100-used,own:false,other:true,rank:99});
    s.players=list.filter(p=>p.share>0).map(p=>{
      const pp=prev&&prev.pl[p.name];
      const an=rnd()*2*Math.PI, r2=20*Math.sqrt(rnd())+2;
      return Object.assign(p,{key:m.name+"|"+p.name,parent:s,frac:p.share/100,target:1,
        x:pp?s.x+pp.dx:s.x+r2*Math.cos(an),y:pp?s.y+pp.dy:s.y+r2*Math.sin(an),w:pp?pp.w:0});
    });
    return s;
  });
  renderLegend(sites);
  const st={sites,drag:null,dragP:null};

  function step(){
    for(const s of sites){const dx=s.x-s.px,dy=s.y-s.py;if(dx||dy)s.players.forEach(p=>{p.x+=dx;p.y+=dy});}
    // Gezogenes Produkt folgt der Maus; zieht man über den Rand, wird der ganze Markt mitgezogen
    const dp=st.dragP;
    if(dp){
      dp.x=dp.tx;dp.y=dp.ty;const s=dp.parent;
      if(s.poly&&!d3.polygonContains(s.poly,[dp.x,dp.y])){
        keepInside(dp,s.poly);
        s.x+=(dp.tx-dp.x)*0.12;s.y+=(dp.ty-dp.y)*0.12;
        const ddx=s.x-CX,ddy=s.y-CY,dist=Math.hypot(ddx,ddy),lim=R-18;
        if(dist>lim){s.x=CX+ddx*lim/dist;s.y=CY+ddy*lim/dist}
      }
    }
    const r=relax(sites,CLIP,st.drag,0.22);
    for(const s of sites){if(s!==st.drag)keepInside(s,CLIP);s.px=s.x;s.py=s.y}
    for(const s of sites){
      if(!s.poly)continue;
      const area=Math.abs(d3.polygonArea(s.poly));
      s.players.forEach(p=>{p.target=p.frac*area;keepInside(p,s.poly)});
      const ri=relax(s.players,s.poly,dp&&dp.parent===s?dp:null,0.3);
      r.err+=ri.err*0.2;r.move+=ri.move*0.3;
    }
    return r;
  }
  function savePos(){
    sites.forEach(s=>{const pl={};s.players.forEach(p=>pl[p.name]={dx:p.x-s.x,dy:p.y-s.y,w:p.w});pos.set(state.company.name+"|"+s.m.name,{x:s.x,y:s.y,w:s.w,pl})});
  }
  for(let i=0;i<((ms[0]&&pos.has(state.company.name+"|"+ms[0].name))?40:260);i++)step();

  // Zoom-Ebene: alles Gezeichnete liegt in einer Gruppe, die Mausrad, Knöpfe und Fingergesten skalieren
  const zl=svg.append("g").attr("class","zl");
  zl.append("circle").attr("class","ring").attr("cx",CX).attr("cy",CY).attr("r",R+6);
  const gLeaf=zl.append("g"), gMkt=zl.append("g"), gLbl=zl.append("g");
  const vb=svg.node().viewBox.baseVal;
  zoom.extent([[vb.x,vb.y],[vb.x+vb.width,vb.y+vb.height]]).translateExtent([[vb.x,vb.y],[vb.x+vb.width,vb.y+vb.height]])
    .on("zoom",ev=>{zt=ev.transform;zl.attr("transform",zt);if(!relabelRaf)relabelRaf=requestAnimationFrame(()=>{relabelRaf=0;relabel&&relabel()});$("#zoomReset").textContent=Math.round(zt.k*100)+" %";setTouchAction()});
  svg.call(zoom).on("dblclick.zoom",null);
  // Zoomzustand übernehmen, ohne einen laufenden Zoom abzubrechen
  svg.property("__zoom",zt);zl.attr("transform",zt);$("#zoomReset").textContent=Math.round(zt.k*100)+" %";setTouchAction();
  const tip=$("#tip"), stage=$(".stage");

  const dragFilter=ev=>!ev.button&&!(ev.type==='touchstart'&&narrowScreen());
  const mDrag=d3.drag().container(zl.node()).filter(dragFilter)
    .on("start",(ev,m)=>{st.drag=m;m.ox=ev.x-m.x;m.oy=ev.y-m.y;tip.hidden=true;wake()})
    .on("drag",(ev,m)=>{
      let x=ev.x-m.ox,y=ev.y-m.oy;
      const dx=x-CX,dy=y-CY,dist=Math.hypot(dx,dy),lim=R-18;
      if(dist>lim){x=CX+dx*lim/dist;y=CY+dy*lim/dist}
      m.x=x;m.y=y;wake();
    })
    .on("end",()=>{st.drag=null;wake()});
  const pDrag=d3.drag().container(zl.node()).filter(dragFilter)
    .on("start",(ev,p)=>{st.dragP=p;p.ox=ev.x-p.x;p.oy=ev.y-p.y;p.tx=p.x;p.ty=p.y;tip.hidden=true;wake()})
    .on("drag",(ev,p)=>{p.tx=ev.x-p.ox;p.ty=ev.y-p.oy;wake()})
    .on("end",()=>{st.dragP=null;wake()});

  function draw(){
    const leaves=[];sites.forEach(s=>s.poly&&s.players.forEach(p=>p.poly&&leaves.push(p)));
    relabel=()=>drawLabels(gLbl,sites,leaves,mDrag);
    gLeaf.selectAll("path").data(leaves,d=>d.key).join(en=>en.append("path").attr("class","leaf")
        .style("fill",d=>d.own?`var(${catOf(d.parent.a.bcg)[1]})`:d.parent.m.growth>=state.thr?"var(--comp-up)":"var(--comp-down)")
        .style("fill-opacity",d=>d.own?1:d.other?0.28:Math.max(0.5,0.95-d.rank*0.08))
        .call(pDrag)
        .on("mousemove",(ev,d)=>{if(!st.drag&&!st.dragP)showTip(ev,d)})
        .on("mouseleave",()=>tip.hidden=true)
        .on("click",(ev,d)=>{
          if(ev.defaultPrevented)return;
          // Touch: Antippen zeigt die Details kurz an
          if(window.matchMedia("(hover:none)").matches){showTip(ev,d);clearTimeout(tipT);tipT=setTimeout(()=>tip.hidden=true,3000)}
          select(d.parent.m.name);
        }))
      .attr("d",d=>roundedPath(d.poly,11));
    gMkt.selectAll("path").data(sites.filter(s=>s.poly),d=>d.m.name).join("path")
      .attr("class",d=>"mkt"+(state.sel===d.m.name?" sel":"")).attr("d",d=>roundedPath(d.poly,16));
    drawLabels(gLbl,sites,leaves,mDrag);
  }
  function showTip(ev,d){
    const r=stage.getBoundingClientRect();tip.hidden=false;tip.innerHTML="";
    const add=(t,b)=>{const e=document.createElement(b?"b":"span");e.textContent=t;tip.append(e,document.createElement("br"))};
    add(d.name,true);
    add(`${fmt(d.share,1)} % in ${d.parent.m.name}`);
    add(`${d.parent.a.bcg} · Markt ${d.parent.m.growth>=0?"+":""}${fmt(d.parent.m.growth,1)} % p.a.`);
    let x=ev.clientX-r.left+14,y=ev.clientY-r.top+14;if(x+250>r.width)x-=270;
    tip.style.left=x+"px";tip.style.top=y+"px";
  }

  let frames=0;
  function frame(){
    raf=0;
    let r=step();if(st.drag)r=step();
    draw();savePos();
    frames++;
    if(st.drag||st.dragP||((r.move>0.05||r.err>0.01)&&frames<500))raf=requestAnimationFrame(frame);
  }
  function wake(){frames=0;if(!raf)raf=requestAnimationFrame(frame)}
  draw();savePos();
}

function drawLabels(g,sites,leaves,mDrag){
  g.selectAll("*").remove();
  const placed=[];
  const fits=r=>!placed.some(p=>r.x<p.x+p.w&&r.x+r.w>p.x&&r.y<p.y+p.h&&r.y+r.h>p.y);
  // Marktlabels als Bogenschrift außen am Kreis
  const FS1=LBL.FS1,FS2=LBL.FS2,RM=R+12+FS2+FS1*0.5;
  const items=[];
  for(const s of sites){
    if(!s.poly)continue;
    const [cx,cy]=d3.polygonCentroid(s.poly), m=s.m;
    const gr=`${m.growth>=0?"▲ +":"▼ "}${fmt(m.growth,0)} %`;
    const l2=`${s.a.bcg.toUpperCase()} · ${gr} p.a.`;
    const span=Math.max(m.name.length*FS1*0.55/(R+12+FS2+FS1*0.4),l2.length*FS2*0.62/(R+12));
    const ang=Math.atan2(cy-CY,cx-CX), edge=s.poly.some(q=>Math.hypot(q[0]-CX,q[1]-CY)>R-2);
    items.push({s,cx,cy,gr,ang,ang0:ang,edge,span:span+0.07});
  }
  // Winkel auseinanderschieben, bis sich die Bögen nicht mehr überlappen
  items.sort((a,b)=>a.ang-b.ang);
  for(let it=0;it<60&&items.length>1;it++){
    let moved=false;
    for(let i=0;i<items.length;i++){
      const A=items[i],B=items[(i+1)%items.length];
      let gap=B.ang-A.ang;if(i===items.length-1)gap+=2*Math.PI;
      const need=(A.span+B.span)/2;
      if(gap<need){const d=(need-gap)/2+0.002;A.ang-=d;B.ang+=d;moved=true}
    }
    if(!moved)break;
  }
  const defs=g.append("defs");
  items.forEach((L,i)=>{
    const s=L.s,m=s.m,cat=catOf(s.a.bcg),a=L.ang,half=Math.min(Math.PI*0.95,L.span/2+0.35);
    const bottom=Math.sin(a)>0.05;
    // Unten läuft der Bogen gegen den Uhrzeigersinn, damit die Schrift lesbar bleibt
    const arc=(r)=>{
      const a0=bottom?a+half:a-half,a1=bottom?a-half:a+half;
      return `M${CX+r*Math.cos(a0)},${CY+r*Math.sin(a0)}A${r},${r} 0 ${half>Math.PI/2?1:0} ${bottom?0:1} ${CX+r*Math.cos(a1)},${CY+r*Math.sin(a1)}`;
    };
    // Innen Kategorie und Wachstum, außen der Marktname
    const rIn=bottom?R+12+FS2*0.75:R+12, rOut=bottom?rIn+5+FS1*0.75:rIn+FS2*0.75+5;
    const id1="arc"+i+"a",id2="arc"+i+"b";
    defs.append("path").attr("id",id1).attr("d",arc(rOut));
    defs.append("path").attr("id",id2).attr("d",arc(rIn));
    let da=Math.abs(a-L.ang0)%(2*Math.PI);if(da>Math.PI)da=2*Math.PI-da;
    if(!L.edge||da>0.3){
      g.append("path").attr("class","leader").attr("d",`M${L.cx},${L.cy}L${CX+(R-1)*Math.cos(a)},${CY+(R-1)*Math.sin(a)}L${CX+(R+8)*Math.cos(a)},${CY+(R+8)*Math.sin(a)}`);
      g.append("circle").attr("class","leader-dot").attr("cx",L.cx).attr("cy",L.cy).attr("r",3.5);
    }
    const gg=g.append("g").attr("class","mlbl"+(state.sel===m.name?" sel":"")).datum(s).call(mDrag).on("click",ev=>{if(!ev.defaultPrevented)select(m.name)});
    const tName=gg.append("text").attr("class","mname").attr("font-size",FS1);
    tName.append("textPath").attr("href","#"+id1).attr("startOffset","50%").attr("text-anchor","middle").text(m.name.toUpperCase());
    const t2=gg.append("text").attr("class","mgr").attr("font-size",FS2);
    const tp=t2.append("textPath").attr("href","#"+id2).attr("startOffset","50%").attr("text-anchor","middle");
    tp.append("tspan").style("fill",`var(${cat[1]})`).style("font-weight",700).text(s.a.bcg.toUpperCase()+" · ");
    tp.append("tspan").style("fill",`var(${arrowVar(m)})`).text(L.gr.slice(0,1));
    tp.append("tspan").text(L.gr.slice(1)+" p.a.");
  });
  const ordered=leaves.slice().sort((a,b)=>(b.own-a.own)||(Math.abs(d3.polygonArea(b.poly))-Math.abs(d3.polygonArea(a.poly))));
  for(const d of ordered){
    if(d.other)continue;
    const area=Math.abs(d3.polygonArea(d.poly));
    const k=zt.k,sa=area*k*k; // sichtbare Fläche nach Zoom
    if(!d.own&&sa<2600)continue;
    const fs=(d.own?Math.max(LBL.min,Math.min(26,Math.sqrt(sa)/6)):Math.max(LBL.min*0.9,Math.min(13,Math.sqrt(sa)/9)))/k;
    const [cx,cy]=d3.polygonCentroid(d.poly);
    const pct=fmt(d.share,d.share<10?1:0)+" %";
    const fill=d.own?`var(${catOf(d.parent.a.bcg)[2]})`:"var(--on-comp)";
    let done=false;
    for(const sc of [1,0.8,0.62]){
      if(done)break;
      const f=fs*sc,two=d.own&&sa>1400*sc;
      const ctext=sa>7000?`${d.name} ${pct}`:d.name;
      // Breite nach dem tatsächlich angezeigten Text schätzen, damit Wettbewerber-Labels nicht überlappen
      const w=(d.own?Math.max(pct.length*f*0.6,two?d.name.length*f*0.33:0):ctext.length*f*0.55)+6,h=two?f*1.75:f*1.1;
      for(const dy of [0,h*0.9,-h*0.9,h*1.8,-h*1.8]){
        const y=cy+dy,box={x:cx-w/2,y:y-h/2,w,h};
        if(!d3.polygonContains(d.poly,[cx,y])||!d3.polygonContains(d.poly,[box.x+2,y])||!d3.polygonContains(d.poly,[box.x+w-2,y]))continue;
        if(!fits(box))continue;
        placed.push(box);
        const t=g.append("text").attr("class","lbl").attr("text-anchor","middle").style("fill",fill);
        if(d.own){
          t.append("tspan").attr("x",cx).attr("y",two?y-f*0.05:y+f*0.36).attr("font-size",f).text(pct);
          if(two)t.append("tspan").attr("x",cx).attr("y",y+f*0.72).attr("font-size",f*0.5).attr("font-weight",600).text(d.name);
        }else t.append("tspan").attr("x",cx).attr("y",y+f*0.36).attr("font-size",f).attr("font-weight",600).text(ctext);
        done=true;break;
      }
    }
  }
}

// ---------- Tabelle ----------
function renderTable(){
  const tb=$("#tbody");tb.innerHTML="";
  const shown=new Set(marketsShown().map(m=>m.name));
  state.company.markets.slice().sort((a,b)=>(b[state.sizeBy]||0)-(a[state.sizeBy]||0)).forEach(m=>{
    const a=analyse(m,state.thr);
    const tr=document.createElement("tr");tr.className="row"+(state.sel===m.name?" sel":"");
    if(!shown.has(m.name))tr.style.opacity=.5;
    const c=(t,cls)=>{const td=document.createElement("td");if(cls)td.className=cls;td.textContent=t;tr.append(td);return td};
    const td0=c("");const b=document.createElement("b");b.textContent=m.name;td0.append(b);
    // Volumen steht zusätzlich unter dem Markt, sichtbar sobald die Volumen-Spalte aus Platzgründen ausgeblendet ist
    const sv=document.createElement("small");sv.className="vol-inline";sv.textContent=`Volumen ${fmt(m.size,m.size<10?1:0)}`;td0.append(sv);
    const sr=document.createElement("small");sr.className="rma-inline";sr.textContent=`rel. MA ${fmt(analyse(m,state.thr).rel,2)}`;

// ---------- BCG-Matrix ----------
function renderBCG(){
  const svg=d3.select("#bcg");svg.selectAll("*").remove();
  const el=$("#bcg"),H=250,M={l:56,r:14,t:10,b:34};
  let W=420;
  // Breitbild: Matrix nutzt die volle Kartenbreite bei begrenzter Höhe, die Tabelle bekommt den Rest
  if(window.matchMedia("(min-width:1100px)").matches&&el.clientWidth){
    const hpx=Math.max(170,Math.min(360,$("#board").clientHeight*0.34,el.clientWidth*0.6));
    W=Math.max(420,H*el.clientWidth/hpx);el.style.height=hpx+"px";
  }else el.style.height="";
  el.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const ms=state.company.markets.map(m=>({m,a:analyse(m,state.thr)}));
  const r=d3.scaleSqrt().domain([0,d3.max(ms,d=>d.m.revenue)||1]).range([3,26]);
  const rmax=d3.max(ms,d=>r(d.m.revenue))||10;
  // Achsen an die äußersten Blasen anpassen: Datenbereich (inkl. Trennlinien) plus Blasenradius als Rand
  const rels=ms.map(d=>Math.min(Math.max(d.a.rel,0.01),100));
  const rx=[Math.min(1,d3.min(rels)),Math.max(1,d3.max(rels))];
  const gy=[Math.min(state.thr,d3.min(ms,d=>d.m.growth)),Math.max(state.thr,d3.max(ms,d=>d.m.growth))];
  if(gy[1]-gy[0]<4){gy[0]-=2;gy[1]+=2}
  const x0=d3.scaleLog().domain([rx[0]/1.15,rx[1]*1.15]).range([M.l+rmax+2,W-M.r-rmax-2]); // hoher Anteil rechts
  const y0=d3.scaleLinear().domain(gy).range([H-M.b-rmax-2,M.t+rmax+16]);
  const x=d3.scaleLog().domain([x0.invert(M.l),x0.invert(W-M.r)]).range([M.l,W-M.r]);
  const y=d3.scaleLinear().domain([y0.invert(H-M.b),y0.invert(M.t)]).range([H-M.b,M.t]);
  const [xa,xb]=x.domain();
  const xt=[0.01,0.02,0.05,0.1,0.25,0.5,1,2,5,10,20,50,100].filter(v=>v>=xa&&v<=xb);
  svg.append("g").attr("class","axis").attr("transform",`translate(0,${H-M.b})`).call(d3.axisBottom(x).tickValues(xt).tickFormat(d=>fmt(d,d<1?2:0)).tickSizeOuter(0));
  svg.append("g").attr("class","axis").attr("transform",`translate(${M.l},0)`).call(d3.axisLeft(y).ticks(6).tickFormat(d=>d+" %").tickSizeOuter(0));
  svg.append("line").attr("class","div").attr("x1",x(1)).attr("x2",x(1)).attr("y1",M.t).attr("y2",H-M.b);
  svg.append("line").attr("class","div").attr("x1",M.l).attr("x2",W-M.r).attr("y1",y(state.thr)).attr("y2",y(state.thr));
  const q=[["Fragezeichen",M.l+6,M.t+12,"start","--q"],["Star",W-M.r-6,M.t+12,"end","--star"],["Poor Dog",M.l+6,H-M.b-8,"start","--dog"],["Cash Cow",W-M.r-6,H-M.b-8,"end","--cow"]];
  q.forEach(([t,xx,yy,an,c])=>svg.append("text").attr("class","q").attr("x",xx).attr("y",yy).attr("text-anchor",an).style("fill",`var(${c})`).text(t));
  svg.append("text").attr("x",(M.l+W-M.r)/2).attr("y",H-4).attr("text-anchor","middle").text("relativer Marktanteil (log)");
  svg.append("text").attr("transform",`translate(11,${(M.t+H-M.b)/2}) rotate(-90)`).attr("text-anchor","middle").text("Marktwachstum (% p.a.)");
  const g=svg.append("g"), gl=svg.append("g"), nodes=[];
  ms.sort((a,b)=>b.m.revenue-a.m.revenue).forEach(({m,a})=>{
    const cx=x(Math.min(Math.max(a.rel,0.01),100)),cy=y(m.growth);
    g.append("circle").attr("cx",cx).attr("cy",cy).attr("r",r(m.revenue))
      .style("fill",`var(${catVar(a.bcg)})`).style("fill-opacity",state.sel===m.name?1:.7)
      .style("stroke",state.sel===m.name?"var(--ink)":"var(--surface)").style("stroke-width",state.sel===m.name?2.5:1.5).style("cursor","pointer")
      .on("click",()=>select(m.name)).append("title").text(`${m.name}: rel. MA ${fmt(a.rel,2)}, Wachstum ${fmt(m.growth,0)} %`);
    nodes.push({m,cx,cy,rr:r(m.revenue)});
  });
  // Beschriftungen ohne Überlappung: Kandidatenpositionen rund um die Blase, die mit den wenigsten Kollisionen gewinnt
  const ov=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  const bubbles=nodes.map(n=>({n,x:n.cx-n.rr,y:n.cy-n.rr,w:2*n.rr,h:2*n.rr}));
  const placed=[];
  svg.selectAll("text.q").each(function(){try{const b=this.getBBox();placed.push({x:b.x-2,y:b.y-1,w:b.width+4,h:b.height+2})}catch(e){}});
  nodes.forEach(n=>{
    const t=gl.append("text").style("fill","var(--ink)").text(n.m.name);
    let w=n.m.name.length*6,h=13;
    try{const bb=t.node().getBBox();if(bb.width){w=bb.width;h=bb.height}}catch(e){}
    const d=n.rr+3, k=d*0.72;
    const cands=[[0,-d-h*0.25,"middle"],[d+2,h*0.32,"start"],[-d-2,h*0.32,"end"],[0,d+h*0.75,"middle"],
      [k,-k-1,"start"],[-k,-k-1,"end"],[k,k+h*0.7,"start"],[-k,k+h*0.7,"end"]];
    let best=null;
    for(const [dx,dy,an] of cands){
      const tx=n.cx+dx,ty=n.cy+dy;
      const box={x:an==="middle"?tx-w/2:an==="start"?tx:tx-w,y:ty-h*0.78,w,h};
      let cost=0;
      placed.forEach(p=>cost+=ov(box,p)*4);
      bubbles.forEach(b=>{if(b.n!==n)cost+=ov(box,b)});
      if(box.x<M.l-2||box.x+box.w>W-2||box.y<0||box.y+box.h>H-M.b)cost+=5000;
      if(!best||cost<best.cost)best={cost,tx,ty,an,box};
      if(cost===0)break;
    }
    t.attr("x",best.tx).attr("y",best.ty).attr("text-anchor",best.an);
    placed.push(best.box);
  });
  svg.selectAll("text.q").raise();
}

// ---------- Suche & Vorschläge ----------
const sugg=$("#sugg"), q=$("#q");
let items=[], act=-1;
function closeSugg(){sugg.hidden=true;q.setAttribute("aria-expanded","false");act=-1}
function localMatches(s){
  const n=norm(s); if(!n)return allCompanies().map(c=>({c,why:null}));
  const out=[],have=new Set(allCompanies().map(c=>norm(c.name)));
  // Verzeichnis-Einträge ausblenden, wenn es für den Konzern schon Daten gibt (auch bei leicht abweichendem Namen)
  const known=new Set();allCompanies().forEach(c=>[c.name,...(c.aliases||[])].forEach(x=>{const k=norm(x);if(k.length>2)known.add(k)}));
  const dup=d=>{const n=norm(d.name);return [...have].some(h=>h===n||h.startsWith(n+" ")||n.startsWith(h+" "))||known.has(n)||d.aliases.some(x=>norm(x).length>2&&known.has(norm(x)))};
  for(const c of [...allCompanies(),...DIRECTORY.filter(d=>!dup(d))]){
    const nn=norm(c.name);
    if(nn.includes(n)){out.push({c,why:null,score:nn.startsWith(n)?0:1});continue}
    const al=(c.aliases||[]).find(a=>norm(a).startsWith(n))||(n.length>2&&(c.aliases||[]).find(a=>norm(a).includes(n)));
    if(al)out.push({c,why:al,score:2});
  }
  // Unternehmen mit Daten zuerst, dann Verzeichnis-Einträge
  return out.sort((a,b)=>(a.score-b.score)||((a.c.dir?1:0)-(b.c.dir?1:0))).slice(0,10);
}
function drawSugg(list,extra){
  sugg.innerHTML="";items=[];
  const add=(html,fn,cls)=>{const d=document.createElement("div");d.className="sg"+(cls?" "+cls:"");d.setAttribute("role","option");html(d);d.onmousedown=e=>{e.preventDefault();fn()};sugg.append(d);items.push({el:d,fn})};
  list.forEach(({c,why})=>add(d=>{
    const b=document.createElement("b");b.textContent=c.name;
    const s=document.createElement("small");s.textContent=(why?`gehört zu ${c.name} (über „${why}“)`:c.hq||"")+(c.dir?" · wird geschätzt":c.source==="claude"?" · Claude":"");
    d.append(b,s)},()=>c.dir?pickDirectory(c):show(c)));
  if(extra)extra(add);
  const v=q.value.trim();
  if(v&&sample)add(d=>{d.textContent=`„${v}“ mit Claude suchen – auch Mutterkonzerne`},()=>claudeSuggest(v),"claude");
  else if(v&&!list.length){const d=document.createElement("div");d.className="sg hd";d.textContent="Keine eingebauten Daten zu diesem Namen";sugg.append(d)}
  sugg.hidden=!sugg.children.length;q.setAttribute("aria-expanded",String(!sugg.hidden));act=-1;
}
// Kein Treffer im Verzeichnis: nach kurzer Tipppause automatisch Claude nach passenden Konzernen fragen
let autoT=0;
q.addEventListener("input",()=>{
  const list=localMatches(q.value);drawSugg(list);
  clearTimeout(autoT);
  const v=q.value.trim();
  if(sample&&v.length>=3&&!list.length)autoT=setTimeout(()=>{if(q.value.trim()===v&&document.activeElement===q)claudeSuggest(v)},900);
});
function pickDirectory(c){
  if(sample)return generate(c.name);
  closeSugg();msg(`Für ${c.name} gibt es keine eingebauten Marktdaten. Die Schätzung durch Claude funktioniert nur, wenn die Seite in claude.ai geöffnet ist.`,"err");
}
q.addEventListener("focus",()=>drawSugg(localMatches(q.value)));
q.addEventListener("blur",()=>setTimeout(closeSugg,120));
q.addEventListener("keydown",e=>{
  if(sugg.hidden)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();act=(act+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;items.forEach((it,i)=>it.el.classList.toggle("act",i===act))}
  else if(e.key==="Enter"){e.preventDefault();(items[act]||items[0])?.fn()}
  else if(e.key==="Escape")closeSugg();
});

// ---------- Claude ----------
function busy(t){$("#busy").hidden=!t;$("#busyText").textContent=t||""}
$("#stop").onclick=()=>ctl?.abort();
function errText(e){
  const c=e&&e.code;
  if(c==="cancelled")return "";
  if(c==="not_granted"||c==="sampling_disabled")return "Claude ist für diese Seite nicht freigegeben. Die eingebauten Unternehmen funktionieren weiter.";
  if(c==="rate_limited")return "Zu viele Anfragen an Claude. Bitte in einer Minute erneut versuchen.";
  if(c==="invalid_json")return "Claudes Antwort war kein gültiges Datenformat. Bitte erneut versuchen.";
  if(c==="refused")return "Claude hat diese Anfrage abgelehnt. Bitte einen anderen Namen versuchen.";
  return "Claude konnte gerade nicht antworten. Bitte erneut versuchen.";
}
async function claudeSuggest(text){
  sugg.innerHTML="";const d=document.createElement("div");d.className="sg hd";d.textContent="Claude sucht passende Konzerne …";sugg.append(d);sugg.hidden=false;
  try{
    const res=await sample.json(
`Ein Nutzer tippt in eine Unternehmenssuche: "${text.slice(0,80)}".
Nenne bis zu 5 Unternehmen bzw. Konzerne, die gemeint sein könnten. Ist der Begriff eine Marke, ein Produkt oder eine Tochter, nenne zuerst den obersten Mutterkonzern (z. B. "Facebook" -> "Meta Platforms", "Google" -> "Alphabet") und danach die Tochter selbst, falls sie eigenständig analysierbar ist.
Antworte nur mit einem JSON-Array: [{"name":"offizieller Konzernname","note":"kurzer Hinweis auf Deutsch, max. 8 Wörter"}]`,{modelTier:"quick"});
    if(q.value.trim()!==text)return; // inzwischen weitergetippt
    const arr=(Array.isArray(res)?res:[]).filter(x=>x&&x.name).slice(0,5);
    if(document.activeElement!==q)q.focus();
    drawSugg([],add=>{
      const h=document.createElement("div");h.className="sg hd";h.textContent="Vorschläge von Claude";sugg.append(h);
      arr.forEach(x=>{
        const local=allCompanies().find(c=>norm(c.name)===norm(x.name)||(c.aliases||[]).some(a=>norm(a)===norm(x.name)));
        add(dd=>{const b=document.createElement("b");b.textContent=String(x.name);const s=document.createElement("small");s.textContent=local?"Daten vorhanden":String(x.note||"");dd.append(b,s)},
          ()=>local?show(local):generate(String(x.name)));
      });
      if(!arr.length){const n=document.createElement("div");n.className="sg hd";n.textContent="Kein passendes Unternehmen gefunden";sugg.append(n)}
    });
  }catch(e){closeSugg();const t=errText(e);if(t)msg(t,"err")}
}
function normalizeCompany(raw,name){
  if(!raw||!Array.isArray(raw.markets))throw {code:"invalid_json"};
  const num=v=>{const n=Number(v);return isFinite(n)?n:0};
  const markets=raw.markets.filter(m=>m&&m.name&&Array.isArray(m.players)).map(m=>{
    let players=m.players.filter(p=>p&&p.name).map(p=>[String(p.name).slice(0,40),Math.max(0,num(p.share)),p.own?1:0]).filter(p=>p[1]>0);
    const sum=players.reduce((a,p)=>a+p[1],0); if(sum>100)players=players.map(p=>[p[0],p[1]*100/sum,p[2]]);
    return {name:String(m.name).slice(0,40),basis:String(m.basis||"").slice(0,60),size:Math.max(0,num(m.size)),growth:num(m.growth),revenue:Math.max(0,num(m.revenue)),players};
  }).filter(m=>m.players.some(p=>p[2]));
  if(!markets.length)throw {code:"invalid_json"};
  return {id:"c-"+norm(raw.name||name).replace(/\W+/g,"-"),name:String(raw.name||name).slice(0,60),hq:String(raw.hq||"").slice(0,60),
    revenue:num(raw.revenue)||null,year:num(raw.year)||null,aliases:(raw.aliases||[]).map(String).slice(0,20),markets,source:"claude"};
}
async function generate(name){
  closeSugg();msg("");
  if(!sample){msg("Claude ist in dieser Ansicht nicht verfügbar.","err");return}
  ctl=new AbortController();
  busy(`Claude schätzt das Marktportfolio von ${name} … das dauert meist 20–60 Sekunden.`);
  try{
    const raw=await sample.json(
`Du bist Strategieberater und erstellst eine Portfolioanalyse (BCG-Logik) für den Konzern "${name}".
Bestimme die 4 bis 8 umsatzstärksten Märkte, in denen der Konzern mit eigenen Produkten oder Marken aktiv ist. Fasse mehrere eigene Produkte im selben Markt zusammen (z. B. Facebook und Instagram im Markt Social-Media-Werbung).
Für jeden Markt: weltweites Marktvolumen, erwartetes jährliches Wachstum (CAGR der nächsten 3-5 Jahre, darf negativ sein), Konzernumsatz in diesem Markt und Marktanteile: die eigenen Produkte (own: true) und die 6 bis 10 größten Wettbewerber (own: false), so dass zusammen möglichst 85 % des Markts abgedeckt sind. Anteile in Prozent, Summe höchstens 100; den Rest nicht nennen.
Nutze dein bestes Wissen mit den aktuellsten verfügbaren Zahlen, gerundet. Marktnamen kurz auf Deutsch (max. 3 Wörter).
Antworte nur mit JSON in genau dieser Form:
{"name":"Konzernname","hq":"Stadt, Land","revenue":Konzernumsatz in Mrd USD,"year":Geschäftsjahr,"aliases":["bekannte Marken und Töchter in Kleinbuchstaben"],
"markets":[{"name":"Marktname","basis":"wie der Anteil gemessen ist, z. B. Anteil am Umsatz","size":Marktvolumen Mrd USD,"growth":Wachstum %,"revenue":Konzernumsatz Mrd USD,
"players":[{"name":"Produkt/Marke","share":Anteil %,"own":true},{"name":"Wettbewerber","share":Anteil %,"own":false}]}]}`,
      {signal:ctl.signal,cache:{gcTime:86400000}});
    const c=normalizeCompany(raw,name);
    generated=generated.filter(g=>g.id!==c.id&&norm(g.name)!==norm(c.name));generated.unshift(c);generated=generated.slice(0,20);
    try{localStorage.setItem(LS_KEY,JSON.stringify(generated))}catch(e){}
    show(c);
  }catch(e){const t=errText(e);if(t)msg(t,"err")}
  finally{busy("")}
}

// Diagrammkarte so breit wie der Kreis bei voller Höhe, mit gleichem Rand ringsum
function fitLayout(){
  // Kopfzeile: bricht sie um, steht die Suche allein in Zeile 1 und alle Regler in Zeile 2
  const tb=$("[data-card=title] .toolbar");
  tb.classList.remove("stack");
  const sr=tb.querySelector(".search"),mid=sr.offsetTop+sr.offsetHeight/2;
  if([...tb.querySelectorAll(".ctl")].some(c=>c.offsetTop>mid))tb.classList.add("stack");
  const main=$("#board"),stage=$('[data-card=chart]'),svg=$("#chart");
  if(!window.matchMedia("(min-width:1100px)").matches){main.style.removeProperty("--chartw");return}
  for(let i=0;i<8;i++){
    const box=svg.getBoundingClientRect();
    const chromeW=stage.offsetWidth-box.width;
    // Breite des äußeren Rahmens messen: das Raster selbst wächst mit einer festen Spaltenbreite mit und taugt nicht als Maßstab
    const avail=$(".wrap").clientWidth;
    const max=avail-370-parseFloat(getComputedStyle(main).columnGap||0);
    // mindestens 45 % der Breite, damit Kopf und Legende nicht umbrechen und den Kreis schrumpfen
    const w=Math.round(Math.min(Math.max(box.height+chromeW,avail*0.45),max));
    const cur=parseFloat(main.style.getPropertyValue("--chartw"))||0;
    if(Math.abs(cur-w)<2)break;
    main.style.setProperty("--chartw",w+"px");
  }
}
